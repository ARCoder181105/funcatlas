name: Node CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgres://funcatlas:funcatlas@localhost:5432/funcatlas?sslmode=disable
      # There is no .env in CI, and env.ts fails fast on a missing key. These
      # are placeholders -- no test reaches GitHub.
      NODE_ENV: test
      # Every key without a default in apps/api/src/env.ts has to be here, or
      # the whole API suite fails at import rather than at a test.
      # `apps/api/src/env.test.ts` is what keeps this list honest.
      WEB_APP_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      REDIS_URL: redis://localhost:6379
      QUEUE_NAME: funcatlas-parse
      GITHUB_CLIENT_ID: ci-client-id
      GITHUB_CLIENT_SECRET: ci-client-secret
      GITHUB_REDIRECT_URI: http://localhost:3000/auth/callback
      GITHUB_WEBHOOK_SECRET: ci-webhook-secret
      SESSION_SECRET: ci-session-secret-not-a-real-one
    # The API's graph tests run against a real Postgres. Without one they skip,
    # which passes CI while proving nothing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: funcatlas
          POSTGRES_PASSWORD: funcatlas
          POSTGRES_DB: funcatlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U funcatlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      # Sessions live in Redis. Without one the session tests fail rather than
      # skip -- REDIS_URL is always set, so there is nothing to skip on.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Version comes from package.json's "packageManager" field (single source of truth).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - name: Apply migrations
        run: |
          docker run --rm --network host -v $(pwd)/services/parser/migrations:/migrations \
            migrate/migrate -path /migrations -database "${DATABASE_URL}" up
      - run: pnpm -r test

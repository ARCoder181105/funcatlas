name: Go CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgres://funcatlas:funcatlas@localhost:5432/funcatlas?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: funcatlas
          POSTGRES_PASSWORD: funcatlas
          POSTGRES_DB: funcatlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U funcatlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/parser/go.sum
      - name: Install CGO toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: services/parser
      - name: go mod tidy check
        working-directory: services/parser
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: go vet
        working-directory: services/parser
        run: go vet ./...
      - name: migration check
        run: |
          docker run --rm --network host -v $(pwd)/services/parser/migrations:/migrations migrate/migrate -path /migrations -database "${DATABASE_URL}" up
      - name: go test
        working-directory: services/parser
        run: go test -race ./...
      - name: go build
        working-directory: services/parser
        run: go build -o parser ./cmd/parser
      - name: parser sample check
        working-directory: services/parser
        run: ./parser --repo ./testdata/sample --format summary

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: funcatlas
      POSTGRES_PASSWORD: funcatlas
      POSTGRES_DB: funcatlas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funcatlas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    # Sessions live here. Without a volume every restart signs everyone out,
    # which in development means losing the login on each `make up`.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The API and the worker are the same image with different entrypoints. Only
  # the worker spawns the parser, but one image is one thing to keep in step.
  api: &node
    build:
      # The repo root, not apps/api: the Dockerfile COPYs the workspace
      # manifests and packages/shared, which live above that directory.
      context: .
      dockerfile: apps/api/Dockerfile
    image: funcatlas-node
    env_file: .env
    environment:
      # `environment` wins over `env_file`, which is the point: .env is written
      # for host-native `make start`, where Postgres and Redis are on
      # localhost. Inside a container localhost is the container, so these two
      # have to be service names or every connection is refused.
      DATABASE_URL: postgres://funcatlas:funcatlas@postgres:5432/funcatlas?sslmode=disable
      REDIS_URL: redis://redis:6379
      # The default is an absolute host path from `make go-build-bin`. In the
      # image the binary is somewhere else entirely.
      PARSER_BIN: /usr/local/bin/funcatlas-parser
      # Everything else stays host-facing on purpose: the browser runs on the
      # host, so WEB_APP_URL, CORS_ORIGIN and GITHUB_REDIRECT_URI are correct
      # as written in .env.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Bound to loopback, not 0.0.0.0. With FUNCATLAS_SINGLE_USER set there is
    # no authentication in front of this, and the host's port mapping is the
    # only thing keeping it off the network -- the process cannot bind loopback
    # itself or Docker could not reach it. See R39.
    ports:
      - "127.0.0.1:3000:3000"

  # Nothing consumed the queue before this existed. A webhook verified its
  # HMAC, enqueued a job, answered 202, and the graph never changed -- which
  # reads as a slow parse rather than as a missing process.
  worker:
    <<: *node
    image: funcatlas-node
    command: ["./node_modules/.bin/tsx", "src/worker.ts"]
    ports: []

  web:
    build: ./apps/web
    depends_on:
      - api
    ports:
      - "5173:5173"

  parser:
    build: ./services/parser
    env_file: .env
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: funcatlas
      POSTGRES_PASSWORD: funcatlas
      POSTGRES_DB: funcatlas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funcatlas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    # Sessions live here. Without a volume every restart signs everyone out,
    # which in development means losing the login on each `make up`.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build: ./apps/web
    depends_on:
      - api
    ports:
      - "5173:5173"

  parser:
    build: ./services/parser
    env_file: .env
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:

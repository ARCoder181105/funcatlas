<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="funcatlas">
  <title>funcatlas</title>

  <!--
    The product's own notation at 16px: one caller, two callees, and the third
    edge trailing off to a callee that could not be resolved.

    Ultramarine ground rather than a transparent glyph, so the mark holds its
    shape against a light tab strip and a dark one without two files. The
    colours are tokens.ts's Ultramarine values written out, because a favicon
    is fetched by the browser and cannot read a CSS variable.
  -->
  <rect width="32" height="32" rx="8" fill="#0a0b10" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#242839" />

  <g fill="none" stroke-width="1.6" stroke-linecap="round">
    <!-- exact: solid -->
    <path d="M11 16 C 15 16, 15 9.5, 20 9.5" stroke="#6b8cff" />
    <!-- name_match: dashed -->
    <path d="M11 16 H 20" stroke="#e0885a" stroke-dasharray="3.2 2.4" />
    <!-- unresolved: dotted, running to the edge of the mark -->
    <path d="M11 16 C 15 16, 15 22.5, 20 22.5" stroke="#767c92" stroke-dasharray="0.1 3" />
  </g>

  <!-- The caller, then the three callees it reaches with three different
       certainties. The last is hollow: the map's own boundary. -->
  <circle cx="9" cy="16" r="2.6" fill="#eceefa" />
  <circle cx="22.5" cy="9.5" r="2.1" fill="#6b8cff" />
  <circle cx="22.5" cy="16" r="2.1" fill="#e0885a" />
  <circle cx="22.5" cy="22.5" r="1.9" fill="none" stroke="#767c92" stroke-width="1.4" />
</svg>

# The web app is a single-page bundle with two client routes, `/` and `/app`.
# Without the fallback below, a refresh on /app or a link straight to it asks
# nginx for a file that does not exist and gets a 404 -- the same job
# `vercel.json`'s rewrite does on Vercel.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames, so these can be cached indefinitely. Kept above the
    # catch-all: a missing asset should 404 rather than quietly return the
    # HTML shell, which is how a broken build looks like a routing bug.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell itself must never be cached, or a deploy leaves browsers asking
    # for the previous build's asset names.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
